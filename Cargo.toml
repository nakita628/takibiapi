# Cargo workspace. The Rust extension crate lives next to its pyproject.toml in packages/takibiapi,
# so that directory is both a uv and a Cargo workspace member. The crate has no version of its own:
# maturin takes the package version from pyproject.toml. The lint levels are crate attributes in
# packages/takibiapi/src/lib.rs.
[workspace]
resolver = "2"
members = ["packages/takibiapi"]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/nakita628/takibiapi"

[workspace.dependencies]
pyo3 = "0.29"
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
